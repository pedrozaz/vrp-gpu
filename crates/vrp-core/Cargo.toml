[package]
name = "vrp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core data structures, CPU heuristics, and GPU host-orchestration for VRP"

[dependencies]
cudarc = { version = "0.19.9", optional = true, default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-version-from-build-system"] }

[features]
default = []
gpu = ["dep:cudarc"]
